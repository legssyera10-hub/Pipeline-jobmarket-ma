# Référentiel des technologies : nom canonique -> variantes.
#
# Forme courte :   python: [python, python3]
#   variantes insensibles à la casse, délimitées comme des mots.
# Forme longue :
#   excel:
#     variants: [ms excel]       # variantes insensibles à la casse
#     variants_cs: [Excel]       # variantes sensibles à la casse ("excel in..." non)
#     exclude_after: ['\s+(?:in|at)\b']   # regex refusées juste après la variante
#     strict: true               # pas de détection dans un mot collé ("NoSQL" != sql)
#     regex: ['...']             # motifs Python bruts, pour les cas sans variante sûre
#
# Délimitation (voir src/transform/technologies.py) : la variante ne doit pas être
# collée à une lettre/chiffre, SAUF transition minuscule->Majuscule, fréquente dans les
# descriptions dont le HTML a été retiré ("PythonLinux", "experienceSQL").

# --- Langages -----------------------------------------------------------------
python: [python, python3]
java:
  variants: [java]
  exclude_after: ['\s*script']        # JavaScript n'est pas Java
javascript: [javascript, ecmascript]
typescript: [typescript]
c:
  # La lettre seule est inexploitable ("Grade C", "C-level") : contextes sûrs seulement
  regex:
    - '(?<![A-Za-z0-9_+#./])C(?=\s*/\s*C\+\+)'
    - '(?i:\b(?:ansi|embedded)\s+c\b(?![+#]))'
    - '(?i:\bc\s+(?:programming|language)\b)'
    - '(?<=, )C(?=,)'
cpp: [c++, cpp]
csharp: [c#, csharp, c sharp]
go:
  variants: [golang]
  regex:
    - '(?<=, )Go(?=,| and |/)'
    - '\bGo\s+(?:programming|language)\b'
rust:
  variants_cs: [Rust]                 # "rust" = corrosion dans les offres de maintenance
scala: [scala]
kotlin: [kotlin]
swift:
  variants: [swiftui]
  variants_cs: [Swift]                 # "swift response"
r:
  # "R&D", "R. Smith" : on n'accepte R que dans une énumération ou suivi d'un contexte
  regex:
    - '(?:(?<=, )|(?<=/)|(?<=\band )|(?<=\bor ))R(?![A-Za-z0-9_&''+\-.])'
    - '(?<![A-Za-z0-9_&''./])R(?=,\s|/| programming| Studio|Studio| and (?:Python|SQL|SAS))'
    - '\bRStudio\b'
ruby:
  variants_cs: [Ruby]
ruby_on_rails: [ruby on rails]        # pas "rails" : offres ferroviaires
php: [php]
perl: [perl]
matlab: [matlab]
sas:
  variants_cs: [SAS]
vba: [vba]
bash: [bash, shell scripting, shell script]
powershell: [powershell]
cobol: [cobol]
haskell: [haskell]
elixir: [elixir]
lua: [lua]
dart: [dart]
julia: [julia language, julialang]
groovy: [groovy]
