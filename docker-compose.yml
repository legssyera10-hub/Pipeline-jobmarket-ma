# Infrastructure locale du pipeline.
#   docker compose up -d                  -> MinIO + PostgreSQL + Airflow (UI : localhost:8080)
#   docker compose run --rm app <cmd>     -> conteneur Python 3.11 / Java 17 / PySpark
# Les identifiants viennent de .env (voir .env.example), jamais écrits en dur ici.
# restart: unless-stopped : tout redémarre avec Docker Desktop (collecte à 14:00/18:00).

name: jobmarket

x-airflow-common: &airflow-common
  # Airflow 3.3.2 (dernier correctif de la 3.3) ; image dérivée : ajoute le provider
  # Docker avec les contraintes officielles d'Airflow (voir docker/airflow.Dockerfile)
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  image: jobmarket-airflow:3.3.2
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Africa/Casablanca
    # Un DAG nouveau est en pause : on l'active délibérément après vérification
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Mémoire : Docker a 5,4 Go ; deux jobs Spark en parallèle ne tiennent pas
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?générer AIRFLOW_FERNET_KEY dans .env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?générer AIRFLOW_JWT_SECRET dans .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API__BASE_URL: http://localhost:8080
    # Usage local uniquement (port lié à 127.0.0.1) : pas d'écran de connexion
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Relecture des fichiers de DAGs toutes les 120 s (défaut 30 s) : 3 fichiers qui
    # changent rarement ; mesuré au jour 8 : ~32 % d'un coeur en continu à 30 s.
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "120"
  # Groupe 0 : accès à /var/run/docker.sock pour lancer les conteneurs de jobs
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs/airflow:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
    # Contrôle de santé qui redémarre un service figé (Docker ne le fait pas)
    - ./docker/airflow/autoheal.py:/opt/airflow/autoheal.py:ro
  restart: unless-stopped
  depends_on: &airflow-depends
    airflow-init: { condition: service_completed_successfully }

services:
  minio:
    # Les images officielles minio/minio ne sont plus publiées : on utilise le fork
    # communautaire pgsty/minio (même code AGPL, même API S3), version figée.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?définir MINIO_ROOT_USER dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?définir MINIO_ROOT_PASSWORD dans .env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]  # ce PC uniquement
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Job one-shot : crée le bucket au démarrage (idempotent grâce à --ignore-existing).
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-jobmarket}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      echo 'bucket prêt : '$$MINIO_BUCKET
      "
    restart: "no"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-jobmarket}
    ports: ["127.0.0.1:5432:5432"]  # ce PC uniquement (Power BI : localhost)
    # Diagnostic (jour 8) : des processus serveur s'arrêtent parfois avec le code 2
    # sous forte charge, sans message. Journaliser chaque connexion avec son
    # application permet de relier le PID fautif à son client (Airflow, MLflow, job).
    command: >
      postgres -c log_connections=on
      -c log_line_prefix='%m [%p] %q%a@%d '
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-jobmarket}"]
      # 30 s / 30 s (et non 10 s / 5 s) : moins de connexions et de contrôles tués
      # sur un hôte qui pagine. Atténuation tentée contre des arrêts de processus
      # serveur naissants ; insuffisante seule (un arrêt de plus à 19:01, journal j. 8).
      interval: 30s
      timeout: 30s
      retries: 5
    restart: unless-stopped

  # Environnement d'exécution des jobs (Spark tourne ici, pas sous Windows).
  # Profil "tools" : non démarré par `docker compose up`, lancé à la demande — et par
  # Airflow, qui crée un conteneur de cette image pour chaque tâche (DockerOperator).
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: jobmarket-app:dev
    profiles: ["tools"]
    env_file: .env
    environment:
      # Dans le réseau Docker, les services se joignent par leur nom.
      MINIO_ENDPOINT: http://minio:9000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes: [".:/app"]
    working_dir: /app
    depends_on:
      minio: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # --- Airflow ----------------------------------------------------------------------

  # Crée les bases `airflow` et `mlflow` dans le PostgreSQL existant (idempotent)
  airflow-db-init:
    image: postgres:16
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: ${POSTGRES_USER}
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-jobmarket}
    entrypoint: >
      bash -c "
      for db in airflow mlflow; do
      psql -tAc \"SELECT 1 FROM pg_database WHERE datname = '$$db'\" | grep -q 1
      || psql -c \"CREATE DATABASE $$db\";
      done;
      echo 'bases airflow et mlflow prêtes'
      "
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Suivi des expériences ML (jour 8) : http://localhost:5000
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    image: jobmarket-mlflow:3.17.1
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      # Jobs serveur (évaluation GenAI, scoring en ligne, archivage de traces) :
      # inutilisés ici, 7 processus huey et ~1,35 Go de RAM sur un PC qui en manque.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination s3://${MINIO_BUCKET:-jobmarket}/mlflow
      --serve-artifacts
      --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1:5000"
    ports: ["127.0.0.1:5000:5000"]  # interface accessible depuis ce PC uniquement
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-db-init: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    restart: unless-stopped

  # Migre le schéma d'Airflow et crée le pool "spark" (1 seul job Spark à la fois)
  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - >
        airflow db migrate &&
        airflow pools set spark 1 "Un seul job Spark à la fois (RAM de Docker limitée)"
    restart: "no"
    depends_on:
      airflow-db-init: { condition: service_completed_successfully }

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports: ["127.0.0.1:8080:8080"]  # interface accessible depuis ce PC uniquement
    healthcheck:
      # Les tâches parlent à l'api-server : figé, il les fait échouer (jour 8)
      test: ["CMD", "python", "/opt/airflow/autoheal.py",
             "http://localhost:8080/api/v2/monitor/health", "api-server"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      # Figé 35 min au jour 8 : redémarré après 6 échecs (~3 min), voir autoheal.py
      test: ["CMD", "python", "/opt/airflow/autoheal.py",
             "http://localhost:8974/health", "scheduler"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s

volumes:
  minio_data:
  pg_data:
